version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    # Packages that only work at matching versions go up in one PR. Apart, a PR fails CI
    # (react-dom without react: npm ci ERESOLVE) and the required checks block it for good.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=25"]
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      # every step of codeql-action must run the same version (init, analyze, ...)
      codeql-action:
        patterns: ["github/codeql-action*"]
