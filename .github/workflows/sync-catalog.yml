name: Sync catalog

on:
  schedule:
    - cron: "17 6 * * *" # 03:17 em Brasília
  workflow_dispatch:

concurrency:
  group: sync-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Só a carga; migrations continuam manuais.
      - run: npm run catalog:sync
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
      # Indicações de hoje e de amanhã, com o catálogo recém-atualizado.
      - run: npm run daily:pick
        env:
          DATABASE_URL_POOLED: ${{ secrets.DATABASE_URL_POOLED }}
