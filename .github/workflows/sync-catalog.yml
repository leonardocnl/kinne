name: Sync catalog

on:
  schedule:
    - cron: "17 6 * * *" # 03:17 em Brasília
  workflow_dispatch:

concurrency:
  group: sync-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # A primeira carga completa (~22 mil títulos) cabe com folga; as diárias levam minutos.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Só a carga; migrations continuam manuais.
      # Só a conexão do papel kinne_sync (C1). Resumo só com contagens (D7); nenhum artifact.
      - run: npm run catalog:sync
        env:
          SYNC_TARGET: production
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
          REVALIDATE_ORIGIN: ${{ secrets.REVALIDATE_ORIGIN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Indicações de hoje e de amanhã, com o catálogo recém-atualizado.
      - run: npm run daily:pick
        env:
          DATABASE_URL_POOLED: ${{ secrets.SYNC_DATABASE_URL }}
      # Grafo de gosto com o catálogo recém-atualizado (docs/design/taste-graph.md §9). Por último:
      # se falhar, as indicações do dia já saíram e o grafo de ontem continua (taste-graph-data C4).
      - run: npm run graph:build
        env:
          SYNC_TARGET: production
          SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
